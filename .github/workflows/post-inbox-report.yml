name: Post Inbox Report to Slack

on:
  push:
    branches: [claude/gmail-slack-email-reports-YegU5]
    paths: [reports/latest.json]

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 .github/scripts/post_slack_report.py
